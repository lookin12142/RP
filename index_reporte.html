<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reporte · Conversaciones Smartcito</title>
<style>
  :root{
    --bg: #10131a;
    --panel: #171b24;
    --panel-2: #1d2230;
    --border: #262c3a;
    --text: #e7e9ee;
    --muted: #8991a3;
    --accent: #5b8def;
    --accent-soft: rgba(91,141,239,0.12);
    --warn: #f2b84b;
    --user: #5b8def;
    --assistant: #34d399;
    --mono: 'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', 'IBM Plex Sans', -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }

  .wrap{ max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  header.top{
    display:flex; align-items:baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .eyebrow{
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 4px;
  }
  h1{ font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .sub{ color: var(--muted); font-size: 13px; margin-top: 4px; }

  button.refresh{
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.03em;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; cursor: pointer;
    display:flex; align-items:center; gap:8px; transition: border-color .15s, background .15s;
  }
  button.refresh:hover{ border-color: var(--accent); background: var(--accent-soft); }
  button.refresh:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  button.refresh .dot{
    width:6px; height:6px; border-radius:50%; background: var(--assistant);
    box-shadow: 0 0 0 0 rgba(52,211,153,0.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(52,211,153,0.45); }
    70%{ box-shadow: 0 0 0 6px rgba(52,211,153,0); }
    100%{ box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  }
  @media (prefers-reduced-motion: reduce){
    button.refresh .dot{ animation: none; }
  }

  section.panel{
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .panel h2{
    font-size: 13px; font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin: 0 0 16px; font-weight: 500;
  }

  /* ---- volumen / chart ---- */
  .totals{ display:flex; gap: 28px; margin-bottom: 18px; flex-wrap: wrap; }
  .totals .stat b{
    display:block; font-family: var(--mono); font-size: 26px; font-weight: 600;
    color: var(--text);
  }
  .totals .stat span{ font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  #chart{ width:100%; height: 180px; display:block; }
  .chart-empty, .list-empty{
    color: var(--muted); font-size: 13px; font-family: var(--mono); padding: 24px 4px;
  }

  /* ---- layout entidades / transcripcion ---- */
  .grid{ display:grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px){ .grid{ grid-template-columns: 1fr; } }

  .entidad{
    border-bottom: 1px solid var(--border);
  }
  .entidad:last-child{ border-bottom:none; }
  .entidad-head{
    display:flex; align-items:center; justify-content: space-between;
    padding: 10px 4px; cursor:pointer; user-select:none;
  }
  .entidad-head:hover{ background: var(--panel-2); border-radius: 6px; }
  .entidad-id{ font-family: var(--mono); font-size: 13px; }
  .entidad-nombre{ font-size: 13px; font-weight: 500; display:block; }
  .entidad-sub{ font-family: var(--mono); font-size: 10.5px; color: var(--muted); display:block; margin-top: 2px; }
  .entidad-count{
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }
  .conv-list{ padding: 0 4px 10px 14px; display:none; }
  .conv-list.open{ display:block; }
  .conv-item{
    display:flex; justify-content: space-between; gap: 10px;
    padding: 7px 8px; border-radius: 6px; cursor:pointer;
    font-size: 12.5px; color: var(--muted);
  }
  .conv-item:hover{ background: var(--accent-soft); color: var(--text); }
  .conv-item.active{ background: var(--accent-soft); color: var(--text); }
  .conv-item .when{ font-family: var(--mono); font-size: 11px; }
  .conv-item .n{ font-family: var(--mono); color: var(--warn); }

  .transcript-head{
    display:flex; justify-content: space-between; align-items:baseline;
    margin-bottom: 12px; flex-wrap: wrap; gap: 6px;
  }
  .transcript-head .id{ font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .bubble{
    max-width: 78%; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px;
    font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .bubble .ts{
    display:block; font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-top: 6px; opacity: .75;
  }
  .bubble.user{
    background: var(--accent-soft); border: 1px solid rgba(91,141,239,0.35);
    margin-right: auto; border-top-left-radius: 3px;
  }
  .bubble.assistant{
    background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.3);
    margin-left: auto; border-top-right-radius: 3px;
  }
  .sender-label{
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; display:block;
  }

  .empty-hint{
    color: var(--muted); font-size: 13px; padding: 40px 10px; text-align:center;
    font-family: var(--mono);
  }

  /* ---- reporte inteligente ---- */
  .resumen-ia{
    font-size: 13.5px; line-height: 1.6; color: var(--text); margin-bottom: 20px;
    padding: 14px 16px; background: var(--panel-2); border-left: 3px solid var(--accent);
    border-radius: 6px;
  }
  .ia-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 820px){ .ia-grid{ grid-template-columns: 1fr; } }

  .subhead{
    font-family: var(--mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin: 0 0 10px;
  }
  .rank-row{
    display:flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px dashed var(--border); font-size: 12.5px;
  }
  .rank-row:last-child{ border-bottom:none; }
  .rank-row .n{ font-family: var(--mono); color: var(--warn); }

  .kv{ display:flex; justify-content: space-between; padding: 6px 0; font-size: 12.5px; border-bottom: 1px dashed var(--border); }
  .kv:last-child{ border-bottom:none; }
  .kv .v{ font-family: var(--mono); color: var(--text); }

  .patron-card{
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .patron-tag{
    display:inline-block; font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(91,141,239,0.35);
  }
  .patron-desc{ font-size: 13px; line-height: 1.5; }
  .patron-freq{ font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }

  .recos{ margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }

  table.conv-table{ width:100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  table.conv-table th{
    text-align:left; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  table.conv-table td{ padding: 7px 8px; border-bottom: 1px solid var(--border); }
  table.conv-table tr:last-child td{ border-bottom:none; }

  .badge{
    font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
    display:inline-block; white-space: nowrap;
  }
  .badge.satisfactoria{ background: rgba(52,211,153,0.12); color: var(--assistant); border: 1px solid rgba(52,211,153,0.35); }
  .badge.normal{ background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .badge.insatisfactoria{ background: rgba(242,90,90,0.12); color: #f25a5a; border: 1px solid rgba(242,90,90,0.35); }
  .badge.no_se_puede_calificar{ background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .badge.si{ background: rgba(52,211,153,0.12); color: var(--assistant); border: 1px solid rgba(52,211,153,0.35); }
  .badge.no{ background: rgba(242,90,90,0.12); color: #f25a5a; border: 1px solid rgba(242,90,90,0.35); }
  .badge.parcial{ background: rgba(242,184,75,0.12); color: var(--warn); border: 1px solid rgba(242,184,75,0.35); }
  .badge.no_aplica{ background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div>
      <p class="eyebrow">Smartcito · Chat log</p>
      <h1>Reporte de conversaciones</h1>
      <p class="sub">Últimos 30 días · agente 2</p>
    </div>
    <button class="refresh" id="btnRefresh">
      <span class="dot"></span> Actualizar
    </button>
  </header>

  <section class="panel">
    <h2>Volumen diario</h2>
    <div class="totals" id="totals"></div>
    <div id="chartWrap">
      <svg id="chart" viewBox="0 0 900 180" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section class="panel">
    <h2>Entidades y conversaciones</h2>
    <div class="grid">
      <div>
        <div id="entidades"></div>
      </div>
      <div>
        <div id="transcript">
          <div class="empty-hint">Elegí una conversación de la lista para ver los mensajes.</div>
        </div>
      </div>
    </div>
  </section>
  <section class="panel">
    <h2>Reporte inteligente del día</h2>
    <div id="inteligente">
      <div class="empty-hint">Cargando análisis de IA... puede tardar un poco.</div>
    </div>
  </section>

</div>

<script>
// ---- Configurá acá las URLs reales de tus 3 webhooks de n8n ----
const API = {
  diario: 'https://n8n.smartclic.pe/webhook/reporte-conversaciones-diario',
  lista: 'https://n8n.smartclic.pe/webhook/reporte-conversaciones-lista',
  mensajes: 'https://n8n.smartclic.pe/webhook/reporte-conversacion-mensajes',
  inteligente: 'https://n8n.smartclic.pe/webhook/reporte-inteligente'
};

const $totals = document.getElementById('totals');
const $chart = document.getElementById('chart');
const $entidades = document.getElementById('entidades');
const $transcript = document.getElementById('transcript');
const $btnRefresh = document.getElementById('btnRefresh');

function fmtDate(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('es-PE', { day:'2-digit', month:'short' });
}
function fmtDateTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('es-PE', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

async function cargarVolumen(){
  $chart.innerHTML = '';
  $totals.innerHTML = '<span class="chart-empty">Cargando...</span>';
  try{
    const res = await fetch(API.diario);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    pintarTotales(data.totales || {});
    pintarChart(data.dias || []);
  }catch(err){
    $totals.innerHTML = '<span class="chart-empty">No se pudo cargar el volumen (' + err.message + ')</span>';
  }
}

function pintarTotales(t){
  $totals.innerHTML = `
    <div class="stat"><b>${t.conversaciones ?? 0}</b><span>Conversaciones</span></div>
    <div class="stat"><b>${t.mensajes ?? 0}</b><span>Mensajes</span></div>
    <div class="stat"><b>${t.mensajes_usuario ?? 0}</b><span>De usuarios</span></div>
    <div class="stat"><b>${t.mensajes_asistente ?? 0}</b><span>Del asistente</span></div>
  `;
}

function pintarChart(dias){
  if (!dias.length){
    $chart.outerHTML = '<div class="chart-empty">Sin datos en los últimos 30 días.</div>';
    return;
  }
  const W = 900, H = 180, pad = 24;
  const max = Math.max(1, ...dias.map(d => d.mensajes || 0));
  const barW = (W - pad*2) / dias.length;
  let bars = '';
  let labels = '';
  dias.forEach((d, i) => {
    const h = Math.round(((d.mensajes||0) / max) * (H - pad - 20));
    const x = pad + i * barW;
    const y = H - pad - h;
    bars += `<rect x="${x + barW*0.15}" y="${y}" width="${barW*0.7}" height="${h}" rx="2"
              fill="#5b8def" fill-opacity="0.85">
              <title>${d.fecha}: ${d.mensajes} mensajes / ${d.conversaciones} conversaciones</title>
             </rect>`;
    if (i % Math.ceil(dias.length / 8 || 1) === 0){
      labels += `<text x="${x + barW/2}" y="${H-6}" font-size="9" fill="#8991a3" text-anchor="middle" font-family="monospace">${fmtDate(d.fecha)}</text>`;
    }
  });
  $chart.setAttribute('viewBox', `0 0 ${W} ${H}`);
  $chart.innerHTML = bars + labels;
}

async function cargarEntidades(){
  $entidades.innerHTML = '<div class="list-empty">Cargando...</div>';
  try{
    const res = await fetch(API.lista);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    pintarEntidades(data.entidades || []);
  }catch(err){
    $entidades.innerHTML = '<div class="list-empty">No se pudo cargar la lista (' + err.message + ')</div>';
  }
}

function pintarEntidades(entidades){
  if (!entidades.length){
    $entidades.innerHTML = '<div class="list-empty">No hay conversaciones en el rango.</div>';
    return;
  }
  $entidades.innerHTML = entidades.map((e, idx) => `
    <div class="entidad">
      <div class="entidad-head" data-idx="${idx}">
        <span>
          <span class="entidad-nombre">${escapeHtml(e.nombre)}</span>
          <span class="entidad-sub">${e.ruc ? 'RUC ' + e.ruc : 'ID ' + e.identidad}</span>
        </span>
        <span class="entidad-count">${e.cantidad_conversaciones}</span>
      </div>
      <div class="conv-list" id="conv-list-${idx}">
        ${e.conversaciones.map(c => `
          <div class="conv-item" data-cid="${c.conversation_id}">
            <span class="when">${fmtDateTime(c.started_at)}</span>
            <span class="n">${c.mensajes} msj</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  $entidades.querySelectorAll('.entidad-head').forEach(head => {
    head.addEventListener('click', () => {
      const list = document.getElementById('conv-list-' + head.dataset.idx);
      list.classList.toggle('open');
    });
  });

  $entidades.querySelectorAll('.conv-item').forEach(item => {
    item.addEventListener('click', (ev) => {
      ev.stopPropagation();
      $entidades.querySelectorAll('.conv-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      cargarTranscripcion(item.dataset.cid);
    });
  });
}

async function cargarTranscripcion(conversationId){
  $transcript.innerHTML = '<div class="empty-hint">Cargando conversación...</div>';
  try{
    const res = await fetch(API.mensajes + '?conversation_id=' + encodeURIComponent(conversationId));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    pintarTranscripcion(data);
  }catch(err){
    $transcript.innerHTML = '<div class="empty-hint">No se pudo cargar la conversación (' + err.message + ')</div>';
  }
}

function pintarTranscripcion(data){
  const mensajes = data.mensajes || [];
  if (!mensajes.length){
    $transcript.innerHTML = '<div class="empty-hint">Esta conversación no tiene mensajes.</div>';
    return;
  }
  const bubbles = mensajes.map(m => {
    const isUser = (m.sender || '').toLowerCase() === 'user';
    return `
      <div class="bubble ${isUser ? 'user' : 'assistant'}">
        <span class="sender-label">${isUser ? 'Usuario' : 'Asistente'}</span>
        ${escapeHtml(m.text || '')}
        <span class="ts">${fmtDateTime(m.created_at)}</span>
      </div>
    `;
  }).join('');

  $transcript.innerHTML = `
    <div class="transcript-head">
      <strong>Conversación #${data.conversation_id}</strong>
      <span class="id">${mensajes.length} mensajes</span>
    </div>
    ${bubbles}
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function cargarInteligente(){
  const $el = document.getElementById('inteligente');
  $el.innerHTML = '<div class="empty-hint">Analizando conversaciones con IA... puede tardar 10-30 segundos.</div>';
  try{
    const res = await fetch(API.inteligente);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    pintarInteligente(data);
  }catch(err){
    $el.innerHTML = '<div class="empty-hint">No se pudo cargar el análisis (' + err.message + ')</div>';
  }
}

function pintarInteligente(data){
  const $el = document.getElementById('inteligente');
  const mc = data.metricas_clientes || {};
  const mq = data.metricas_calidad || {};
  const patrones = data.patrones || [];
  const recomendaciones = data.recomendaciones || [];
  const analisis = data.analisis_conversaciones || [];

  const topConv = (mc.top_por_conversaciones || []).map(c => `
    <div class="rank-row">
      <span>${escapeHtml(c.razon_social || ('Identidad ' + c.identidad))}</span>
      <span class="n">${c.conversaciones}</span>
    </div>
  `).join('') || '<div class="empty-hint">Sin datos.</div>';

  const topPreg = (mc.top_por_preguntas || []).map(c => `
    <div class="rank-row">
      <span>${escapeHtml(c.razon_social || ('Identidad ' + c.identidad))}</span>
      <span class="n">${c.preguntas}</span>
    </div>
  `).join('') || '<div class="empty-hint">Sin datos.</div>';

  const distribucion = Object.entries(mq.distribucion_por_tipo_respuesta || {}).map(([tipo, n]) => `
    <div class="kv"><span>${escapeHtml(tipo)}</span><span class="v">${n}</span></div>
  `).join('');

  const patronesHtml = patrones.map(p => `
    <div class="patron-card">
      <span class="patron-tag">${escapeHtml(p.tipo || 'otro')}</span>
      <div class="patron-desc">${escapeHtml(p.descripcion || '')}</div>
      ${p.frecuencia_aproximada ? `<div class="patron-freq">Frecuencia aprox: ${p.frecuencia_aproximada}</div>` : ''}
    </div>
  `).join('') || '<div class="empty-hint">No se detectaron patrones.</div>';

  const recosHtml = recomendaciones.length
    ? `<ul class="recos">${recomendaciones.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ul>`
    : '<div class="empty-hint">Sin recomendaciones.</div>';

  const filasConv = analisis.map(a => `
    <tr>
      <td class="id">#${a.conversation_id}</td>
      <td>${escapeHtml(a.tema_principal || '')}</td>
      <td><span class="badge ${a.resuelta || 'no_aplica'}">${a.resuelta || '-'}</span></td>
      <td><span class="badge ${a.satisfaccion_inferida || 'no_se_puede_calificar'}">${(a.satisfaccion_inferida || '-').replace(/_/g,' ')}</span></td>
    </tr>
  `).join('');

  $el.innerHTML = `
    <div class="resumen-ia">${escapeHtml(data.resumen_general || 'Sin resumen.')}</div>

    <div class="ia-grid">
      <div>
        <p class="subhead">Top clientes por conversaciones</p>
        ${topConv}
      </div>
      <div>
        <p class="subhead">Top clientes por preguntas</p>
        ${topPreg}
      </div>
    </div>

    <div class="ia-grid">
      <div>
        <p class="subhead">Calidad de respuesta</p>
        <div class="kv"><span>Respuestas vacías</span><span class="v">${mq.porcentaje_vacias ?? 0}%</span></div>
        <div class="kv"><span>Tiempo de respuesta promedio</span><span class="v">${mq.tiempo_respuesta_promedio_seg ?? '-'}s</span></div>
        ${distribucion}
      </div>
      <div>
        <p class="subhead">Recomendaciones</p>
        ${recosHtml}
      </div>
    </div>

    <p class="subhead">Patrones detectados</p>
    ${patronesHtml}

    <p class="subhead" style="margin-top:18px;">Análisis por conversación</p>
    ${filasConv ? `
      <table class="conv-table">
        <thead><tr><th>Conv.</th><th>Tema</th><th>Resuelta</th><th>Satisfacción</th></tr></thead>
        <tbody>${filasConv}</tbody>
      </table>
    ` : '<div class="empty-hint">Sin conversaciones analizadas en el rango.</div>'}
  `;
}

function cargarTodo(){
  cargarVolumen();
  cargarEntidades();
  cargarInteligente();
}

$btnRefresh.addEventListener('click', cargarTodo);
window.addEventListener('DOMContentLoaded', cargarTodo);
</script>

</body>
</html>
